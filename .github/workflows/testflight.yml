name: TestFlight

# Déploiement automatique sur TestFlight (tests internes) au push d'un tag "v*".
# Ex. :  git tag v0.2.0 && git push origin v0.2.0
# Lançable aussi manuellement (onglet Actions → Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version marketing (ex. 0.2.0). Laisser vide sur un push de tag."
        required: false
        default: ""

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & upload iOS to TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache VLCKit frameworks
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vlckit-3.7.3-319ed2c0-79128878

      - name: Fetch VLCKit (tvOS + iOS)
        run: bash scripts/fetch_vlckit.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up Ruby & fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Numéro de build unique ET croissant, même en cas de re-run (run_attempt
      # est incrémenté sans changer run_number). TestFlight refuse un doublon.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))" >> "$GITHUB_ENV"

      # iOS uniquement pour l'instant : la fiche d'app tvOS n'existe pas encore.
      # Repasser sur `fastlane beta` (iOS + tvOS) une fois la fiche tvOS créée.
      - name: Deploy to TestFlight (iOS)
        run: bundle exec fastlane ios beta_ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          MARKETING_VERSION: ${{ github.event.inputs.marketing_version || github.ref_name }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/gym
            build
          if-no-files-found: ignore
